name: Update daily README content

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rotate facts, puzzle, and quiz
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import random
          from datetime import date

          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")
          start_marker = "<!-- DAILY_CONTENT_START -->"
          end_marker = "<!-- DAILY_CONTENT_END -->"

          if start_marker not in content or end_marker not in content:
              raise SystemExit("Daily content markers were not found in README.md")

          facts = [
              "Octopuses have three hearts, and two of them pump blood to the gills.",
              "A day on Venus is longer than its year when measured by its rotation and orbit.",
              "The Python programming language was named after Monty Python, not the snake.",
              "The first computer bug was a literal moth found in a relay computer in 1947; the term “bug” was already in use.",
              "Your brain uses cellular recycling processes such as autophagy to break down and reuse damaged components.",
              "The word “robot” comes from a Czech word associated with forced labor.",
              "Binary search can find an item in a sorted list in logarithmic time."
          ]

          puzzles = [
              ("A farmer has 17 sheep. All but 9 run away. How many remain?", "9 sheep. “All but 9” means all except nine ran away."),
              ("What has keys but cannot open locks?", "A piano."),
              ("I am an odd number. Remove one letter and I become even. What number am I?", "Seven. Remove the “s” and it becomes “even”."),
              ("A room has 4 corners. A cat sits in each corner, and each cat sees 3 cats. How many cats are there?", "4 cats; each can see the other three."),
              ("What comes next: 2, 4, 8, 16, __?", "32. Each number doubles.")
          ]

          quizzes = [
              ("Which data structure follows Last In, First Out (LIFO)?", ["A. Queue", "B. Stack", "C. Tree", "D. Graph"], "B — Stack. The last item added is the first item removed."),
              ("Which HTTP status code commonly means “Not Found”?", ["A. 200", "B. 301", "C. 404", "D. 500"], "C — 404."),
              ("Which Git command creates a new branch and switches to it?", ["A. git merge", "B. git switch -c", "C. git status", "D. git clone"], "B — `git switch -c <branch-name>`."),
              ("Which data format commonly uses key-value pairs and arrays?", ["A. JPEG", "B. JSON", "C. MP3", "D. PNG"], "B — JSON."),
              ("What is the average time complexity of hash-table lookup, assuming good hashing?", ["A. O(1)", "B. O(log n)", "C. O(n)", "D. O(n²)"], "A — O(1) on average.")
          ]

          # The daily seed makes the selected content stable for a given date.
          rng = random.Random(date.today().isoformat())
          fact = rng.choice(facts)
          puzzle, puzzle_answer = rng.choice(puzzles)
          question, options, answer = rng.choice(quizzes)

          replacement = f"""<!-- DAILY_CONTENT_START -->

          ### 🧠 Random Fact of the Day

          {fact}

          ### 🧩 Brain Teaser of the Day

          **Puzzle:** {puzzle}

          <details>
          <summary>💡 Reveal the solution</summary>

          **Answer:** {puzzle_answer}

          </details>

          ### ⚡ Tech Quiz of the Day

          **{question}**

          {chr(10).join('- ' + option for option in options)}

          <details>
          <summary>✅ Reveal the answer</summary>

          **Correct answer:** {answer}

          </details>

          <!-- DAILY_CONTENT_END -->"""

          before, remainder = content.split(start_marker, 1)
          _, after = remainder.split(end_marker, 1)
          updated = before + replacement + after

          if updated != content:
              readme_path.write_text(updated, encoding="utf-8")
              print("README daily content updated.")
          else:
              print("README daily content is already up to date.")
          PY

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh daily README content"
          git push
